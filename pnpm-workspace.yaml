# pnpm v11 Security-Hardened Workspace Configuration
# Ref: https://pnpm.io/supply-chain-security
# ⚠️ DO NOT LOWER THESE SETTINGS without security review

packages: []

# =============================================================================
# SUPPLY CHAIN SECURITY (pnpm v11 defaults + explicit hardening)
# =============================================================================

# BLOCK automatic lifecycle scripts execution
# Prevents postinstall/preinstall attacks (e.g., Shai-Hulud, Mini Shai-Hulud)
# Only explicitly allowed packages can run build scripts
strictDepBuilds: true

# RELEASE AGE GATE — Wait 1 day before allowing new package versions
# Prevents freshly published malicious packages from being auto-installed
# Covers: credential stealers, RATs, worm propagation
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

# BLOCK subdependencies from exotic sources (git repos, tarball URLs)
# Ensures transitive deps only come from the configured registry
# Prevents dependency confusion and repo-jacking attacks
blockExoticSubdeps: true

# TRUST POLICY — never downgrade trust level
# Prevents installing packages that lose provenance/trust status
trustPolicy: no-downgrade

# =============================================================================
# VERIFICATION
# =============================================================================

# Verify package integrity via content-addressable store checksums
verifyStoreIntegrity: true

# Audit lockfile for known CVEs on install
audit: true

# =============================================================================
# ALLOWED BUILD PACKAGES (add only if strictly required)
# =============================================================================

# Only uncomment and add packages that genuinely need postinstall scripts
# Example: allowBuilds: [esbuild, core-js, sharp]
# DO NOT add packages here without verifying their build scripts manually
