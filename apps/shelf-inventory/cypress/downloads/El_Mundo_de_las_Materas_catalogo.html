<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>El Mundo de las Materas - Catálogo</title>
  <style>
    @page { margin: 1.5cm; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #1a1a2e;
      background: #fff;
      padding: 20px;
    }
    .catalog-container { max-width: 1200px; margin: 0 auto; }
    
    .header {
      text-align: center;
      padding: 30px 20px;
      border-bottom: 3px solid #2d6a4f;
      margin-bottom: 30px;
    }
    .header .brand { font-size: 48px; margin-bottom: 10px; }
    .header h1 { font-size: 32px; color: #1b4332; margin-bottom: 5px; }
    .header p { font-size: 16px; color: #555; }
    
    .products-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      padding: 10px 0;
    }
    .product-card {
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      overflow: hidden;
      break-inside: avoid;
      page-break-inside: avoid;
    }
    .product-img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
      background: #f5f5f5;
    }
    .product-img.placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 64px;
      color: #999;
    }
    .product-info {
      padding: 12px;
    }
    .product-info h3 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #1b4332;
    }
    .product-info .sku {
      font-size: 11px;
      color: #888;
      margin-bottom: 4px;
    }
    .product-info .prop {
      font-size: 11px;
      color: #666;
      margin-bottom: 2px;
    }
    .product-info .price {
      font-size: 18px;
      font-weight: 700;
      color: #2d6a4f;
    }
    
    .footer {
      text-align: center;
      padding: 30px 20px;
      margin-top: 40px;
      border-top: 2px solid #e0e0e0;
      font-size: 14px;
      color: #666;
    }
    
    @media print {
      body { padding: 0; }
      .header { padding: 20px; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body>
  <div class="catalog-container">
    
    <div class="header">
      <div class="brand">🪴</div>
      <h1>El Mundo de las Materas</h1>
      <p>Catálogo de Productos</p>
    </div>
    <div class="products-grid">
      
      <div class="product-card">
        <div class="product-img placeholder">📦</div>
        <div class="product-info">
          <h3>Matera Clásica Verde</h3>
          <p class="sku">SKU: MAT-001</p>
          
          
          
          
          <p class="price">$25,000.00</p>
        </div>
      </div>

      <div class="product-card">
        <div class="product-img placeholder">📦</div>
        <div class="product-info">
          <h3>Maceta Redonda Blanca</h3>
          <p class="sku">SKU: MAC-001</p>
          
          
          
          
          <p class="price">$18,000.00</p>
        </div>
      </div>

      <div class="product-card">
        <div class="product-img placeholder">📦</div>
        <div class="product-info">
          <h3>Matera Colgante Turquesa</h3>
          <p class="sku">SKU: MAT-C-001</p>
          
          
          
          
          <p class="price">$32,000.00</p>
        </div>
      </div>
    </div>
    
    <div class="footer">
      <p>WhatsApp: +57 300 000 0000</p>
      <p style="margin-top:5px;font-size:12px">Generado desde Shelf. — 10/6/2026</p>
    </div>
  </div>
</body>
</html>
